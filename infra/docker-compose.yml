# InterVU compose. Run from the repo root:
#   docker compose -f infra/docker-compose.yml [--profile X] up -d
#
#   (default)          postgres only — the one hard dependency. Dev default;
#                      api/web run on the host for hot reload.
#   --profile mail     + Mailpit (dev inbox at :8025)
#   --profile files    + MinIO (resume storage)
#   --profile full     + Redis (reserved for future queues)
#   --profile app      FULL STACK IN CONTAINERS: postgres + minio + api
#                      (migrates on boot) + web. Evaluate InterVU with no
#                      Node toolchain installed.
name: intervu

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: intervu
      POSTGRES_PASSWORD: intervu
      POSTGRES_DB: intervu
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intervu"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Dev mail catcher: SMTP :1025, web inbox http://localhost:8025.
  # Start with:  docker compose -f infra/docker-compose.yml up -d mailpit
  mailpit:
    image: axllent/mailpit:latest
    profiles: ["mail", "full"]
    ports:
      - "1025:1025"
      - "8025:8025"

  redis:
    image: redis:7
    profiles: ["full"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    profiles: ["files", "full", "app"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: intervu
      MINIO_ROOT_PASSWORD: intervu-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # ---- containerized app (profile: app) ----
  api:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://intervu:intervu@postgres:5432/intervu
      # Migrations need a direct connection (advisory locks). No pooler here,
      # so it is the same URL — it exists so the schema's directUrl resolves.
      DIRECT_DATABASE_URL: postgresql://intervu:intervu@postgres:5432/intervu
      # Local only. On the deployed database migrations run in CI
      # (.github/workflows/migrate.yml), serialised against the reseed job.
      # Here there is no CI and no second migrator, so the container does it
      # on start — without this a fresh local database gets no schema at all.
      RUN_MIGRATIONS_ON_START: "true"
      PORT: 4000
      WEB_ORIGIN: http://localhost:3000
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: intervu
      S3_SECRET_KEY: intervu-dev-secret
      S3_BUCKET: intervu-files
      # `extract_only` reads the resume, keeps the text, discards the file —
      # for deployments with no durable storage (docs/11). Unset = keep bytes.
      RESUME_STORAGE: ${RESUME_STORAGE:-}
      # SMTP_HOST/SMTP_PORT: set to enable outbound mail (see .env.example)
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
        # On by default here, off by default in the image (apps/web/Dockerfile),
        # because those are different audiences: this compose file IS the demo
        # stack — seeded accounts, a public password, mailpit instead of a mail
        # server — so a /demo that 404s locally only means the one screen you
        # cannot check is the one visitors land on.
        #
        # `DEMO_MODE=false docker compose --profile app build web` turns it off.
        # A real install builds the image directly and gets the safe default.
        #
        # BUILD arg, not environment: Next inlines NEXT_PUBLIC_* at build time,
        # so setting this at runtime does nothing at all.
        NEXT_PUBLIC_DEMO_MODE: ${DEMO_MODE:-true}
        # Kept alongside it so this file states the whole demo contract rather
        # than half of it inheriting from the Dockerfile. These must match the
        # seed, which is where the accounts on /demo actually come from.
        NEXT_PUBLIC_DEMO_ORG: ${DEMO_ORG:-acme}
        NEXT_PUBLIC_DEMO_PASSWORD: ${DEMO_PASSWORD:-intervu-demo}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  miniodata:
