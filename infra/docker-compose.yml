# InterVU compose. Run from the repo root:
#   docker compose -f infra/docker-compose.yml [--profile X] up -d
#
#   (default)          postgres only — the one hard dependency. Dev default;
#                      api/web run on the host for hot reload.
#   --profile mail     + Mailpit (dev inbox at :8025)
#   --profile files    + MinIO (resume storage)
#   --profile full     + Redis (reserved for future queues)
#   --profile app      FULL STACK IN CONTAINERS: postgres + minio + api
#                      (migrates on boot) + web. Evaluate InterVU with no
#                      Node toolchain installed.
name: intervu

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: intervu
      POSTGRES_PASSWORD: intervu
      POSTGRES_DB: intervu
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intervu"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Dev mail catcher: SMTP :1025, web inbox http://localhost:8025.
  # Start with:  docker compose -f infra/docker-compose.yml up -d mailpit
  mailpit:
    image: axllent/mailpit:latest
    profiles: ["mail", "full"]
    ports:
      - "1025:1025"
      - "8025:8025"

  redis:
    image: redis:7
    profiles: ["full"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    profiles: ["files", "full", "app"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: intervu
      MINIO_ROOT_PASSWORD: intervu-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # ---- containerized app (profile: app) ----
  api:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://intervu:intervu@postgres:5432/intervu
      PORT: 4000
      WEB_ORIGIN: http://localhost:3000
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: intervu
      S3_SECRET_KEY: intervu-dev-secret
      S3_BUCKET: intervu-files
      # `extract_only` reads the resume, keeps the text, discards the file —
      # for deployments with no durable storage (docs/11). Unset = keep bytes.
      RESUME_STORAGE: ${RESUME_STORAGE:-}
      # SMTP_HOST/SMTP_PORT: set to enable outbound mail (see .env.example)
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
        # Off by default. `DEMO_MODE=true docker compose --profile app build web`
        # publishes /demo locally, the same way the deployment does (docs/11).
        # It is a BUILD arg because Next inlines NEXT_PUBLIC_* at build time —
        # setting it at runtime does nothing.
        NEXT_PUBLIC_DEMO_MODE: ${DEMO_MODE:-false}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  miniodata:
