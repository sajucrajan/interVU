# Dev infrastructure. Default `up -d` starts ONLY postgres — the one hard
# dependency today. Redis (BullMQ job queues) and MinIO (resume storage) are
# behind the `full` profile until the features that use them land:
#   docker compose -f infra/docker-compose.yml --profile full up -d
# App processes (api/web) run on the host in dev for hot reload; containerized
# app images are an M4 deliverable (see docs/07-roadmap.md).
name: intervu

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: intervu
      POSTGRES_PASSWORD: intervu
      POSTGRES_DB: intervu
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intervu"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    profiles: ["full"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    profiles: ["full"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: intervu
      MINIO_ROOT_PASSWORD: intervu-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
