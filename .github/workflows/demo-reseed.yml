# Nightly reset of the public demo (docs/11).
#
# The demo password is published in seed.ts, so anyone can sign in and edit or
# delete things. That is deliberate — the point is to let people click through
# it. This job makes the damage temporary by rebuilding the database from
# scratch every night.
#
# `migrate reset` DROPS the schema, which is why re-running the idempotent seed
# on its own would not do: the seed upserts, so it restores what was deleted
# but cannot undo what was edited or added.
name: Reset demo data

on:
  schedule:
    # 03:00 UTC daily — quiet hours for the audiences most likely to visit.
    - cron: "0 3 * * *"
  workflow_dispatch: {}

# Shared with migrate.yml: exactly one job may touch the schema at a time.
# This replaces Prisma's advisory lock, which is unreliable on Neon and is
# disabled below.
concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  reseed:
    runs-on: ubuntu-latest
    # Skipped on forks, which have no secret and no demo to reset.
    if: github.repository == 'sajucrajan/interVU'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Reset and reseed
        # Guarded so a missing secret fails loudly rather than silently
        # "succeeding" against nothing.
        env:
          DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DEMO_DATABASE_URL is not set — nothing was reset."
            exit 1
          fi
          # Same script you can run locally (`pnpm demo:reset`), so the
          # nightly job and a local reset cannot drift into meaning
          # different things.
          pnpm --filter @intervu/api demo:reset
