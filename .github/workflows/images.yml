# Container images for self-hosting (docs/13).
#
# Every push to main publishes:
#   ghcr.io/sajucrajan/intervu-api:latest        the API
#   ghcr.io/sajucrajan/intervu-web:latest        the web app, demo page OFF
#   ghcr.io/sajucrajan/intervu-web:demo          the web app, demo page ON
# plus the same three under the commit sha, and under the version on a v* tag.
#
# The web image talks to the API through the same-origin proxy (docs/11): the
# browser calls /api/v1 on the web origin and Next forwards it to
# http://api:4000 — the service name in deploy/docker-compose.yml. That target
# is fixed at build time, so a different topology means rebuilding the image
# with its own API_PROXY_TARGET (apps/web/Dockerfile says how).
#
# Pull requests build the amd64 images without pushing, so a Dockerfile that
# no longer builds fails the PR rather than main.
name: Container images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig.base.json"
      - ".github/workflows/images.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.repository == 'sajucrajan/interVU'
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: intervu-api
            dockerfile: apps/api/Dockerfile
            suffix: ""
            demo: "false"
          - image: intervu-web
            dockerfile: apps/web/Dockerfile
            suffix: ""
            demo: "false"
          - image: intervu-web
            dockerfile: apps/web/Dockerfile
            suffix: "demo"
            demo: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        if: github.event_name != 'pull_request'
      - uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: tags
        shell: bash
        run: |
          owner="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          base="$REGISTRY/$owner/${{ matrix.image }}"
          suffix="${{ matrix.suffix }}"
          sha="${GITHUB_SHA::12}"
          # The demo variant is ":demo" and ":demo-<sha>"; the plain one is
          # ":latest" and ":<sha>".
          if [ -n "$suffix" ]; then
            tags="$base:$suffix,$base:$suffix-$sha"
          else
            tags="$base:latest,$base:$sha"
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            if [ -n "$suffix" ]; then tags="$tags,$base:$suffix-$version"; else tags="$tags,$base:$version"; fi
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "$tags"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1
            API_PROXY_TARGET=http://api:4000
            NEXT_PUBLIC_DEMO_MODE=${{ matrix.demo }}
            NEXT_PUBLIC_DEMO_ORG=acme
            NEXT_PUBLIC_DEMO_PASSWORD=intervu-demo
          cache-from: type=gha,scope=${{ matrix.image }}${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}${{ matrix.suffix }}
